[build-system]
requires = []
build-backend = "_build_backend"
backend-path = ["src/pgextassure"]

[project]
name = "pgextassure"
version = "0.1.0a4"
description = "Static assurance scanner for PostgreSQL extensions"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "PgExtAssure contributors" },
]
dependencies = []
keywords = ["postgresql", "security", "static-analysis", "extensions"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Database",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/borborich/pgextassure"
Repository = "https://github.com/borborich/pgextassure"
"Issue Tracker" = "https://github.com/borborich/pgextassure/issues"
"Security Policy" = "https://github.com/borborich/pgextassure/security/policy"

[project.scripts]
pgextassure = "pgextassure.cli:main"
