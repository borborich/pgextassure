apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgextassure-gateway-state
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgextassure-gateway
  labels:
    app.kubernetes.io/name: pgextassure-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pgextassure-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgextassure-gateway
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          # Replace this release tag with its independently verified digest.
          image: ghcr.io/borborich/pgextassure:0.1.0-alpha.15
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: PGEXTASSURE_MAXIMUM_REQUEST_BYTES
              value: "268435456"
            - name: PGEXTASSURE_MAXIMUM_CONCURRENT_REQUESTS
              value: "4"
            - name: PGEXTASSURE_REQUEST_TIMEOUT_SECONDS
              value: "30"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 320Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 384Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: state
              mountPath: /var/lib/pgextassure
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: pgextassure-gateway-state
        - name: temporary
          emptyDir:
            sizeLimit: 300Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pgextassure-gateway
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pgextassure-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pgextassure-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pgextassure-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              pgextassure.io/admission-client: "true"
      ports:
        - protocol: TCP
          port: 8080
  egress: []
