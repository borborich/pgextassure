{{- include "pgextassure.validate" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pgextassure.fullname" . }}
  labels:
    {{- include "pgextassure.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "pgextassure.selectorLabels" . | nindent 4 }}
  ports:
    - name: mtls
      port: {{ .Values.service.port }}
      targetPort: mtls
      protocol: TCP
