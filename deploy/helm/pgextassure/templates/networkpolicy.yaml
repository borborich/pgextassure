{{- include "pgextassure.validate" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pgextassure.fullname" . }}
  labels:
    {{- include "pgextassure.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "pgextassure.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8443
  {{- if eq .Values.ledger.mode "postgres" }}
  egress:
    {{- toYaml .Values.networkPolicy.postgresEgress | nindent 4 }}
  {{- else }}
  egress: []
  {{- end }}
