name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install --no-deps -e .

      - name: Compile source and tests
        run: python -m compileall -q src tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  distributions:
    name: Reproducible distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        id: python_311
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Python 3.14
        id: python_314
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Build twice and compare bytes
        env:
          PYTHON_311: ${{ steps.python_311.outputs.python-path }}
          PYTHON_314: ${{ steps.python_314.outputs.python-path }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          dist_311="$RUNNER_TEMP/dist-python-311"
          dist_314="$RUNNER_TEMP/dist-python-314"
          mkdir -p "$dist_311" "$dist_314" release-artifacts

          build_distributions() {
            local interpreter="$1"
            local destination="$2"
            "$interpreter" - "$destination" <<'PY'
          import importlib
          from pathlib import Path
          import sys
          import tomllib

          destination = Path(sys.argv[1])
          configuration = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          build_system = configuration["build-system"]
          for backend_path in reversed(build_system.get("backend-path", [])):
              sys.path.insert(0, backend_path)
          backend = importlib.import_module(build_system["build-backend"])
          print(backend.build_wheel(str(destination)))
          print(backend.build_sdist(str(destination)))
          PY
          }

          build_distributions "$PYTHON_311" "$dist_311"
          build_distributions "$PYTHON_314" "$dist_314"

          wheels_311=("$dist_311"/*.whl)
          wheels_314=("$dist_314"/*.whl)
          sdists_311=("$dist_311"/*.tar.gz)
          sdists_314=("$dist_314"/*.tar.gz)
          test "${#wheels_311[@]}" -eq 1
          test "${#wheels_314[@]}" -eq 1
          test "${#sdists_311[@]}" -eq 1
          test "${#sdists_314[@]}" -eq 1

          cmp "${wheels_311[0]}" "${wheels_314[0]}"
          cmp "${sdists_311[0]}" "${sdists_314[0]}"

          cp "${wheels_311[0]}" "${sdists_311[0]}" release-artifacts/
          (
            cd release-artifacts
            sha256sum ./* > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Smoke-test wheel and sdist offline
        env:
          PYTHON_311: ${{ steps.python_311.outputs.python-path }}
          PYTHON_314: ${{ steps.python_314.outputs.python-path }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          wheels=(release-artifacts/*.whl)
          sdists=(release-artifacts/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1

          for interpreter in "$PYTHON_311" "$PYTHON_314"; do
            version="$("$interpreter" -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
            for kind in wheel sdist; do
              artifact="${wheels[0]}"
              if [[ "$kind" == "sdist" ]]; then
                artifact="${sdists[0]}"
              fi

              environment="$RUNNER_TEMP/smoke-$version-$kind"
              report="$RUNNER_TEMP/smoke-$version-$kind.json"
              grouped_report="$RUNNER_TEMP/smoke-$version-$kind-grouped.json"
              generated_report="$RUNNER_TEMP/smoke-$version-$kind-generated.json"
              admission_report="$RUNNER_TEMP/smoke-$version-$kind-admission.json"
              policy_report="$RUNNER_TEMP/smoke-$version-$kind-policy.json"
              policy_template="$RUNNER_TEMP/smoke-$version-$kind-policy-template.json"
              evidence_bundle="$RUNNER_TEMP/smoke-$version-$kind-evidence.zip"
              evidence_predicate="$RUNNER_TEMP/smoke-$version-$kind-evidence.json"
              evidence_sbom="$RUNNER_TEMP/smoke-$version-$kind-sbom.json"
              "$interpreter" -m venv "$environment"
              PIP_NO_INDEX=1 "$environment/bin/python" -m pip install --no-deps "$artifact"
              "$environment/bin/pgextassure" policy-template adoption \
                --output "$policy_template"
              "$environment/bin/pgextassure" pilot --help >/dev/null
              "$environment/bin/pgextassure" scan tests/fixtures/safe \
                --scope-plan tests/fixtures/scope-plan.json \
                --format json \
                --output "$report" \
                --fail-on high
              "$environment/bin/pgextassure" scan tests/fixtures/vulnerable \
                --format grouped-json \
                --output "$grouped_report" \
                --fail-on none
              "$environment/bin/pgextassure" scan tests/fixtures/generated \
                --generation-plan tests/fixtures/generated/generation-plan.json \
                --format json \
                --output "$generated_report" \
                --fail-on high
              "$environment/bin/pgextassure" scan tests/fixtures/admission \
                --baseline tests/fixtures/admission/baseline.json \
                --format grouped-json \
                --output "$admission_report" \
                --fail-on critical
              "$environment/bin/pgextassure" scan tests/fixtures/safe \
                --policy tests/fixtures/policy.json \
                --format json \
                --output "$policy_report"
              "$environment/bin/pgextassure" evidence create \
                tests/fixtures/safe \
                --scope-plan tests/fixtures/scope-plan.json \
                --policy tests/fixtures/policy.json \
                --created-on 2026-07-29 \
                --component-name distribution-smoke \
                --component-version "$version-$kind" \
                --output "$evidence_bundle"
              "$environment/bin/pgextassure" evidence verify \
                "$evidence_bundle" \
                --predicate-output "$evidence_predicate" \
                --sbom-output "$evidence_sbom" >/dev/null
              "$environment/bin/python" -m pgextassure scan tests/fixtures/safe \
                --format text \
                --fail-on high >/dev/null
              "$environment/bin/python" -c \
                'import json, pathlib, sys; regular = json.loads(pathlib.Path(sys.argv[1]).read_text()); grouped = json.loads(pathlib.Path(sys.argv[2]).read_text()); generated = json.loads(pathlib.Path(sys.argv[3]).read_text()); admission = json.loads(pathlib.Path(sys.argv[4]).read_text()); policy = json.loads(pathlib.Path(sys.argv[5]).read_text()); template = json.loads(pathlib.Path(sys.argv[6]).read_text()); evidence = json.loads(pathlib.Path(sys.argv[7]).read_text()); sbom = json.loads(pathlib.Path(sys.argv[8]).read_text()); assert regular["schema_version"] == "1.4"; assert regular["coverage"]["skipped_count"] >= 0; assert regular["scope"]["schema_version"] == "1.0"; assert grouped["report_type"] == "pgextassure.root-cause-groups"; assert grouped["summary"]["root_causes"] > 0; assert generated["schema_version"] == "1.4"; assert len(generated["generation"]["artifacts"]) == 1; assert admission["schema_version"] == "1.3"; assert admission["admission"]["summary"]["baselined"] == 1; assert policy["policy"]["result"]["blocked_count"] == 0; assert template["schema_version"] == "1.0"; assert template["admission"]["require_suppression_ticket"] is True; assert evidence["schema_version"] == "1.0"; assert evidence["result"]["gate"] == "pass"; assert sbom["spdxVersion"] == "SPDX-2.3"' \
                "$report" "$grouped_report" "$generated_report" "$admission_report" "$policy_report" "$policy_template" "$evidence_predicate" "$evidence_sbom"
            done
          done

      - name: Upload release-ready distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pgextassure-distributions
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7

  release-attestations:
    name: Tagged release attestations
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pgextassure-distributions
          path: release-artifacts

      - name: Attest tagged release distributions
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            release-artifacts/*.whl
            release-artifacts/*.tar.gz

  action-e2e:
    name: Composite Action end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare paths, including spaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            "$RUNNER_TEMP/pgextassure action/safe" \
            "$RUNNER_TEMP/pgextassure-e2e/shadow-sentinels"
          cp -R tests/fixtures/safe/. "$RUNNER_TEMP/pgextassure action/safe/"
          mkdir -- --help
          cp -R tests/fixtures/safe/. ./--help/

          # A caller-controlled workspace must not be able to shadow pip, the
          # scanner package, or Python's startup customization hook.
          mkdir pip pgextassure
          for module in pip pgextassure; do
            cat > "$module/__init__.py" <<'PY'
          import os
          from pathlib import Path

          marker = Path(os.environ["PGEXTASSURE_SHADOW_SENTINEL_DIR"])
          (marker / f"{__name__}.executed").write_text("executed", encoding="utf-8")
          raise RuntimeError(f"hostile workspace module imported: {__name__}")
          PY
          done
          cat > sitecustomize.py <<'PY'
          import os
          from pathlib import Path

          marker = Path(os.environ["PGEXTASSURE_SHADOW_SENTINEL_DIR"])
          (marker / "sitecustomize.executed").write_text("executed", encoding="utf-8")
          raise RuntimeError("hostile workspace sitecustomize imported")
          PY

          echo "PGEXTASSURE_SAFE_INPUT=$RUNNER_TEMP/pgextassure action/safe" >> "$GITHUB_ENV"
          echo "PGEXTASSURE_SHADOW_SENTINEL_DIR=$RUNNER_TEMP/pgextassure-e2e/shadow-sentinels" >> "$GITHUB_ENV"

      - name: Scan safe fixture to SARIF
        uses: ./
        with:
          path: ${{ env.PGEXTASSURE_SAFE_INPUT }}
          format: sarif
          output: ${{ runner.temp }}/pgextassure-e2e/safe.sarif
          fail-on: high
          python-version: "3.11"

      - name: Scan safe fixture to JSON
        uses: ./
        with:
          path: ${{ env.PGEXTASSURE_SAFE_INPUT }}
          scope-plan: tests/fixtures/scope-plan.json
          format: json
          output: ${{ runner.temp }}/pgextassure-e2e/safe.json
          fail-on: none
          python-version: "3.14"

      - name: Scan safe fixture with organization policy
        uses: ./
        with:
          path: tests/fixtures/safe
          policy: tests/fixtures/policy.json
          format: json
          output: ${{ runner.temp }}/pgextassure-e2e/policy.json
          python-version: "3.11"

      - name: Create safe enterprise evidence bundle
        uses: ./
        with:
          path: tests/fixtures/safe
          scope-plan: tests/fixtures/scope-plan.json
          policy: tests/fixtures/policy.json
          evidence-output: ${{ runner.temp }}/pgextassure-e2e/evidence.zip
          evidence-predicate-output: ${{ runner.temp }}/pgextassure-e2e/evidence-predicate.json
          evidence-sbom-output: ${{ runner.temp }}/pgextassure-e2e/evidence-sbom.json
          evidence-created-on: "2026-07-29"
          component-name: safe-extension
          component-version: "2.0"
          python-version: "3.11"

      - name: Scan vulnerable fixture to grouped JSON
        uses: ./
        with:
          path: tests/fixtures/vulnerable
          format: grouped-json
          output: ${{ runner.temp }}/pgextassure-e2e/grouped.json
          fail-on: none
          python-version: "3.11"

      - name: Scan generated artifact fixture
        uses: ./
        with:
          path: tests/fixtures/generated
          generation-plan: tests/fixtures/generated/generation-plan.json
          format: json
          output: ${{ runner.temp }}/pgextassure-e2e/generated.json
          fail-on: high
          python-version: "3.11"

      - name: Scan baselined admission fixture
        uses: ./
        with:
          path: tests/fixtures/admission
          baseline: tests/fixtures/admission/baseline.json
          format: grouped-json
          output: ${{ runner.temp }}/pgextassure-e2e/baseline.json
          fail-on: critical
          python-version: "3.11"

      - name: Scan temporarily suppressed admission fixture
        uses: ./
        with:
          path: tests/fixtures/admission
          suppressions: tests/fixtures/admission/suppressions.json
          evaluated-on: "2026-07-29"
          format: sarif
          output: ${{ runner.temp }}/pgextassure-e2e/suppressed.sarif
          fail-on: critical
          python-version: "3.11"

      - name: Exercise stdout mode
        uses: ./
        with:
          path: tests/fixtures/safe
          format: text
          output: ""
          fail-on: none
          python-version: "3.11"

      - name: Scan an option-looking input path
        uses: ./
        with:
          path: --help
          format: json
          output: ${{ runner.temp }}/pgextassure-e2e/option-looking.json
          fail-on: high
          python-version: "3.11"

      - name: Verify vulnerable fixture fails the gate
        id: vulnerable-gate
        continue-on-error: true
        uses: ./
        with:
          path: tests/fixtures/vulnerable
          format: json
          output: ${{ runner.temp }}/pgextassure-e2e/vulnerable.json
          fail-on: high
          annotations: active
          max-annotations: "10"
          python-version: "3.11"

      - name: Validate reports and gate outcome
        env:
          VULNERABLE_GATE_OUTCOME: ${{ steps.vulnerable-gate.outcome }}
          SAFE_SARIF: ${{ runner.temp }}/pgextassure-e2e/safe.sarif
          SAFE_JSON: ${{ runner.temp }}/pgextassure-e2e/safe.json
          POLICY_JSON: ${{ runner.temp }}/pgextassure-e2e/policy.json
          GROUPED_JSON: ${{ runner.temp }}/pgextassure-e2e/grouped.json
          GENERATED_JSON: ${{ runner.temp }}/pgextassure-e2e/generated.json
          BASELINE_JSON: ${{ runner.temp }}/pgextassure-e2e/baseline.json
          SUPPRESSED_SARIF: ${{ runner.temp }}/pgextassure-e2e/suppressed.sarif
          OPTION_LOOKING_JSON: ${{ runner.temp }}/pgextassure-e2e/option-looking.json
          VULNERABLE_JSON: ${{ runner.temp }}/pgextassure-e2e/vulnerable.json
          EVIDENCE_ZIP: ${{ runner.temp }}/pgextassure-e2e/evidence.zip
          EVIDENCE_PREDICATE: ${{ runner.temp }}/pgextassure-e2e/evidence-predicate.json
          EVIDENCE_SBOM: ${{ runner.temp }}/pgextassure-e2e/evidence-sbom.json
          SHADOW_SENTINEL_DIR: ${{ runner.temp }}/pgextassure-e2e/shadow-sentinels
        shell: bash
        run: |
          set -euo pipefail
          test "$VULNERABLE_GATE_OUTCOME" = "failure"
          shopt -s nullglob dotglob
          shadow_sentinels=("$SHADOW_SENTINEL_DIR"/*)
          test "${#shadow_sentinels[@]}" -eq 0
          python -I - <<'PY'
          import json
          import os
          from pathlib import Path

          sarif = json.loads(Path(os.environ["SAFE_SARIF"]).read_text(encoding="utf-8"))
          safe = json.loads(Path(os.environ["SAFE_JSON"]).read_text(encoding="utf-8"))
          policy = json.loads(
              Path(os.environ["POLICY_JSON"]).read_text(encoding="utf-8")
          )
          grouped = json.loads(
              Path(os.environ["GROUPED_JSON"]).read_text(encoding="utf-8")
          )
          generated = json.loads(
              Path(os.environ["GENERATED_JSON"]).read_text(encoding="utf-8")
          )
          baseline = json.loads(
              Path(os.environ["BASELINE_JSON"]).read_text(encoding="utf-8")
          )
          suppressed = json.loads(
              Path(os.environ["SUPPRESSED_SARIF"]).read_text(encoding="utf-8")
          )
          option_looking = json.loads(
              Path(os.environ["OPTION_LOOKING_JSON"]).read_text(encoding="utf-8")
          )
          vulnerable = json.loads(
              Path(os.environ["VULNERABLE_JSON"]).read_text(encoding="utf-8")
          )
          predicate = json.loads(
              Path(os.environ["EVIDENCE_PREDICATE"]).read_text(encoding="utf-8")
          )
          evidence_sbom = json.loads(
              Path(os.environ["EVIDENCE_SBOM"]).read_text(encoding="utf-8")
          )
          assert Path(os.environ["EVIDENCE_ZIP"]).is_file()

          assert sarif["version"] == "2.1.0"
          assert safe["schema_version"] == "1.4"
          assert safe["coverage"]["skipped_count"] >= 0
          assert safe["scope"]["schema_version"] == "1.0"
          assert policy["policy"]["result"]["blocked_count"] == 0
          assert grouped["report_type"] == "pgextassure.root-cause-groups"
          assert grouped["summary"]["root_causes"] > 0
          assert generated["schema_version"] == "1.4"
          assert len(generated["generation"]["artifacts"]) == 1
          assert generated["summary"]["findings"] == 0
          assert baseline["schema_version"] == "1.3"
          assert baseline["admission"]["summary"]["baselined"] == 1
          assert baseline["root_causes"][0]["admission"]["status"] == "baselined"
          suppressed_result = suppressed["runs"][0]["results"][0]
          assert suppressed_result["properties"]["admissionStatus"] == "suppressed"
          assert suppressed_result["suppressions"][0]["status"] == "accepted"
          assert option_looking["summary"]["findings"] == 0
          assert safe["tool"]["name"] == "pgextassure"
          assert vulnerable["summary"]["findings"] > 0
          assert predicate["bundle_type"] == "pgextassure.evidence"
          assert predicate["result"]["gate"] == "pass"
          assert evidence_sbom["spdxVersion"] == "SPDX-2.3"
          PY
